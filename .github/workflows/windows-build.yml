name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build environment
        run: echo Preparing BoursePilotAI Windows build

      - name: Build application
        run: echo Build application binaries

      - name: Compile installer
        run: echo Generate BoursePilotAI_Setup.exe

      - name: Package release
        run: echo Prepare release artifact

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoursePilotAI_Setup
          path: Release/
